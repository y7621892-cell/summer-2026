<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אלבום הטיול המשפחתי</title>
  <style>
    :root {
      --primary-color: #ff6b6b;
      --accent-color: #4ecdc4;
      --bg-gradient: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
      --card-bg: rgba(255, 255, 255, 0.75);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* כותרת ראשית */
    header {
      text-align: center;
      margin-top: 40px;
      z-index: 2;
    }

    h1 {
      color: #2d3436;
      font-size: 3rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.8);
    }

    p.subtitle {
      font-size: 1.2rem;
      color: #636e72;
      margin: 0;
    }

    /* מכולת הריבועים (Grid) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      width: 85%;
      max-width: 1100px;
      margin: 50px 0;
      z-index: 2;
    }

    /* כרטיסיות הימים */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      background: rgba(255, 255, 255, 0.9);
    }

    .card-icon {
      font-size: 2.5rem;
      margin-bottom: 15px;
    }

    .card h3 {
      margin: 0 0 15px 0;
      color: #2d3436;
      font-size: 1.4rem;
    }

    .btn-action {
      background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
      box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
      transition: all 0.3s ease;
    }

    .btn-action:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(255, 107, 107, 0.5);
    }

    /* אנימציית אלמנטים צפים ברקע */
    .floating-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .floating-item {
      position: absolute;
      display: block;
      list-style: none;
      font-size: 2rem;
      animation: floatUp 15s linear infinite;
      bottom: -150px;
      opacity: 0.6;
    }

    .floating-item:nth-child(1) { left: 10%; animation-delay: 0s; font-size: 2.5rem; }
    .floating-item:nth-child(2) { left: 20%; animation-delay: 2s; animation-duration: 12s; }
    .floating-item:nth-child(3) { left: 35%; animation-delay: 4s; }
    .floating-item:nth-child(4) { left: 50%; animation-delay: 0s; animation-duration: 18s; }
    .floating-item:nth-child(5) { left: 65%; animation-delay: 6s; }
    .floating-item:nth-child(6) { left: 80%; animation-delay: 3s; animation-duration: 14s; }
    .floating-item:nth-child(7) { left: 90%; animation-delay: 7s; }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.6;
      }
      100% {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- רקע צף -->
  <div class="floating-bg">
    <span class="floating-item">📸</span>
    <span class="floating-item">🏔️</span>
    <span class="floating-item">✈️</span>
    <span class="floating-item">🌊</span>
    <span class="floating-item">☀️</span>
    <span class="floating-item">🎒</span>
    <span class="floating-item">🥨</span>
  </div>

  <header>
    <h1>אלבום הטיול המשפחתי ✈️</h1>
    <p class="subtitle">בוחרים יום ומייצרים קליפ מטורף בלחיצת כפתור!</p>
  </header>

  <!-- תפריט הריבועים -->
  <div class="grid-container">
    <div class="card">
      <div class="card-icon">👑</div>
      <h3>יום 1: אגם המלכים</h3>
      <button class="btn-action" onclick="openGenerator('אגם המלכים')">🎬 צור קליפ רנדומלי</button>
    </div>
    <div class="card">
      <div class="card-icon">🏞️</div>
      <h3>יום 2: פלאך</h3>
      <button class="btn-action" onclick="openGenerator('פלאך')">🎬 צור קליפ רנדומלי</button>
    </div>
    <div class="card">
      <div class="card-icon">🛷</div>
      <h3>יום 3: מגלשות אלפיניות</h3>
      <button class="btn-action" onclick="openGenerator('מגלשות אלפיניות')">🎬 צור קליפ רנדומלי</button>
    </div>
  </div>

  <script>
    function openGenerator(locationName) {
      alert("מנגנון המחולל האוטומטי עבור " + locationName + " יופעל בשלב הבא!");
    }
  </script>
</body>
</html>
